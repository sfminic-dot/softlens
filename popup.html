<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>柔光 · Soft Lens</title></head><body><main><header><div class="mark" aria-hidden="true">✧</div><div><h1>柔光 <span>Soft Lens</span></h1><p>给日常浏览，一点温柔的色彩</p></div><label class="switch"><input id="enabled" type="checkbox" aria-label="全局开启"><span></span></label></header><section class="site"><div><label for="site">在当前网站启用</label><p id="hostname">正在读取网站…</p></div><label class="switch"><input id="site" type="checkbox" disabled aria-label="在当前网站启用"><span></span></label></section><p id="notice" role="status" hidden></p><section><div class="row"><label for="intensity">效果强度</label><output id="percent" for="intensity">20%</output></div><input id="intensity" type="range" min="0" max="100" value="20"><div class="range-label"><span>轻柔</span><span>浓郁</span></div></section><fieldset><legend>选择配色</legend><div id="palettes"></div></fieldset><section class="row motion"><div><label for="motion">缓慢流动</label><p>轻微漂移，让色彩自然呼吸</p></div><label class="switch"><input id="motion" type="checkbox" aria-label="缓慢流动"><span></span></label></section><footer><span id="saved" role="status">设置自动保存</span><button id="reset" type="button">恢复默认</button></footer></main><script type="module" src="/src/popup.ts"></script></body></html>
